<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - St Alphonsus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="text-center mb-4">Admin Login</h2>
        <form onsubmit="return login()">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <div id="error-msg" class="text-danger text-center mt-3" style="display:none;">Invalid login</div>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Set your desired login credentials here
            if (username === "admin" && password === "password123") {
                sessionStorage.setItem("loggedIn", "true");
                window.location.href = "teachers.php"; // Redirect to protected page
                return false;
            } else {
                document.getElementById("error-msg").style.display = "block";
                return false;
            }
        }
    </script>
</body>
</html>
